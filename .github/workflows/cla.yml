# Contributor License Agreement check (CONTRIBUTING.md; CLA.md, section 10), with CLA Assistant Lite.
# A contributor signs once by commenting on their pull request, exactly:
#   I have read the CLA Document and I hereby sign the CLA
# The action records the signature in signatures/version1/cla.json on this repository's cla-signatures
# branch and sets the CLA check on the pull request. A comment "recheck" runs the check again.
#
# Safety: pull_request_target runs this file as it is on the base branch, with a token that can write. It
# never checks out or runs the pull request's code (there is no checkout step). The only secret is the
# workflow's own GITHUB_TOKEN. The action is pinned to a full commit SHA (the tag is in the comment).
# GitHub can't limit contents: write to one branch; the action writes only the signatures file on
# cla-signatures, and branch protection keeps main closed to it.
name: CLA

# Switched off until the CLA is reviewed and in force: manual runs only. To turn it back on, restore these:
#   issue_comment: {types: [created]}
#   pull_request_target: {types: [opened, closed, synchronize]}
on:
  workflow_dispatch:

permissions: {}

jobs:
  cla:
    name: CLA signed
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # re-runs the pull request's earlier CLA check after a signing comment
      contents: write # commits signatures/version1/cla.json to the cla-signatures branch
      pull-requests: write # the comment asking to sign, and the lock after merge
      statuses: write # the CLA status on the pull request
    steps:
      - name: CLA Assistant Lite
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/sensyble/PassybleFirefox/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot],SensybleCo
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          signed-commit-message: "CLA: $contributorName signed in #$pullRequestNo"
          create-file-commit-message: "CLA: start the signatures file"
